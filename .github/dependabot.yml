# Dependency updates for npm, Cargo, and GitHub Actions.
#
# A version bump is not merged on its own: the licence and advisory checks in
# docs/DEPENDENCIES.md and .github/workflows/validate.yml are re-run and the
# recorded licence table is refreshed first. Updates are grouped and monthly to
# keep review load low; security advisories still open their own pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "Update"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "Update"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "Update"
