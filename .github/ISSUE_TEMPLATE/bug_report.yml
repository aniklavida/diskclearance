name: Bug report
description: Report reproducible incorrect behavior. Use private reporting for security or unintended-deletion issues.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include personal file paths or private data.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
